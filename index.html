<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Mounir | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .redirect-container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .serif {
            font-family: 'DM Serif Display', serif;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #333;
            transform: translateY(-2px);
        }
        .auto-redirect {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>Ahmed <span class="serif">Mounir</span></h1>
        <p>Graphic Designer & UI/UX Designer</p>
        <a href="public/index.html" class="btn">Enter Portfolio →</a>
        <div class="auto-redirect">Redirecting in <span id="countdown">3</span> seconds...</div>
    </div>

    <script>
        // Auto-redirect to portfolio
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'public/index.html';
            }
        }, 1000);
    </script>
</body>
</html>
